### Development environment configuration
[development.network]
rpc-url = "http://localhost:8000/rpc"
network-passphrase = "Standalone Network ; February 2017"
run-locally = true # automatically start the local network container, if not already running

[[development.accounts]]
name = "me" # Required. Keys for this account will be saved to `./.stellar/identity`
default = true # Optional. Whether to use this account as the `--source` for commands that need one.

[development.contracts]

[development.contracts.guess_the_number]
client = true
constructor_args = "--admin me"
after_deploy = "reset"

[development.contracts.crowdfunding_core]
client = true
constructor_args = "--admin me --treasury me --fee-bps 700"
after_deploy = """
create_project --ngo_wallet me --tax_category 1 --target_stroops 1111110000000 --metadata_uri '"ipfs://mqc-edicao-2"'
create_project --ngo_wallet me --tax_category 3 --target_stroops 250000000000 --metadata_uri '"ipfs://elo-me"'
create_project --ngo_wallet me --tax_category 1 --target_stroops 370370000000 --metadata_uri '"ipfs://stellarbridge"'
create_project --ngo_wallet me --tax_category 5 --target_stroops 111110000000 --metadata_uri '"ipfs://karn"'
create_project --ngo_wallet me --tax_category 5 --target_stroops 250000000000 --metadata_uri '"ipfs://vizinhanca-cuidadora"'
create_project --ngo_wallet me --tax_category 1 --target_stroops 400000000000 --metadata_uri '"ipfs://web3-liderancas"'
"""

[development.contracts.impact_sbt]
client = true
constructor_args = "--admin me"

# Coming Soon: Specify live contracts to bind & import in this project using the given name.
# During initialization, these contracts will also be "spooned" into the development network,
# meaning that their data will match the live network at the given sequence number.
# [development.contracts.eurc]
# environment = "production"
# address = "C..."
# at-ledger-sequence = 50153603


### Testing environment configuration - Stellar Testnet
[testing.network]
rpc-url = "https://soroban-testnet.stellar.org"
network-passphrase = "Test SDF Network ; September 2015"
run-locally = false

[[testing.accounts]]
name = "me"
default = true

[testing.contracts]

[testing.contracts.crowdfunding_core]
